<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hockey Skating School</title><style>
:root{font-family:Arial,sans-serif;color:#f4f4f4;background:#111}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#202020;border:1px solid #3c3c3c;border-radius:14px;padding:18px;margin:14px 0}.accent{color:#ff7a00}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;margin:5px}.yes{background:#1f9d55;color:white}.no{background:#c43b3b;color:white}.muted{color:#bbb}.session{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #333}.session:last-child{border:0}h1,h2{margin:.2em 0}.hidden{display:none}@media(max-width:600px){.session{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><h1 id="schoolName">Hockey Skating School</h1><div id="responseCard" class="card hidden"><h2 class="accent">Attendance Confirmation</h2><div id="responseInfo"></div><div id="responseButtons"><button class="btn yes" onclick="respond('attending')">✓ Attending</button><button class="btn no" onclick="respond('not_attending')">✕ Not Attending</button></div><p id="responseMsg" class="muted"></p><hr style="border-color:#3a3a3a"><strong>Payment method for this program</strong><div><button class="btn" onclick="paymentMethod('E-Transfer')">E-Transfer</button><button class="btn" onclick="paymentMethod('Cash')">Cash</button></div><p id="paymentMsg" class="muted"></p></div><div class="card"><h2>Upcoming Skates</h2><div id="calendar">Loading…</div></div></div><script>
const params=new URLSearchParams(location.search), attendance=params.get('attendance');
async function json(url,opts){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fmtTime(t){if(!t)return'';const [h,m]=t.slice(0,5).split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
async function load(){try{const c=await json('/api/school/public/config');document.getElementById('schoolName').textContent=c.name}catch{}try{const d=await json('/api/school/calendar');document.getElementById('calendar').innerHTML=d.sessions.length?d.sessions.map(s=>`<div class="session"><strong>${fmtDate(String(s.session_date).slice(0,10))}<br><span class="accent">${fmtTime(s.start_time)}</span></strong><div><strong>${esc(s.title||s.program_name)}</strong><br><span class="muted">${esc(s.location||'')}</span></div></div>`).join(''):'No upcoming skates are posted.'}catch(e){document.getElementById('calendar').textContent=e.message}if(attendance){try{const a=await json('/api/school/respond/'+encodeURIComponent(attendance));document.getElementById('responseCard').classList.remove('hidden');document.getElementById('responseInfo').innerHTML=`<p><strong>${esc(a.player_first_name)} ${esc(a.player_last_name)}</strong></p><p>${esc(a.title)}<br>${fmtDate(String(a.session_date).slice(0,10))} · ${fmtTime(a.start_time)}${a.location?' · '+esc(a.location):''}</p>`;if(a.status!=='no_reply'){document.getElementById('responseMsg').textContent='Current response: '+(a.status==='attending'?'Attending':'Not Attending');}}catch(e){document.getElementById('responseCard').classList.remove('hidden');document.getElementById('responseInfo').textContent=e.message;document.getElementById('responseButtons').classList.add('hidden')}}}
async function respond(status){try{await json('/api/school/respond/'+encodeURIComponent(attendance),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,channel:'web'})});document.getElementById('responseMsg').textContent=status==='attending'?'✓ Attendance confirmed.':'✓ Absence confirmed.';}catch(e){document.getElementById('responseMsg').textContent=e.message}}
async function paymentMethod(paymentMethod){try{await json('/api/school/respond/'+encodeURIComponent(attendance)+'/payment-method',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentMethod})});document.getElementById('paymentMsg').textContent='✓ Payment method: '+paymentMethod;}catch(e){document.getElementById('paymentMsg').textContent=e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
