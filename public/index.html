<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pavel Hockey Academy</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar"><div class="brand">Pavel Hockey Academy</div><div class="actions"><a class="btn primary" href="/signup.html">Player Signup</a><a class="btn" href="/admin.html">Admin</a></div></div><main class="shell"><div class="card"><div class="actions"><div><h1 style="margin-bottom:4px">Upcoming Skates</h1><p class="muted" style="margin:0">Public program schedule</p></div><a class="btn primary" href="/signup.html">Register a Player</a></div><div id="publicSessions" style="margin-top:18px"></div></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('/api/calendar').then(r=>r.json()).then(rows=>{document.getElementById('publicSessions').innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Program</th><th>Time</th><th>Arena</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${e(String(x.session_date).slice(0,10))}</td><td>${e(x.program_name)}</td><td>${e(String(x.start_time||'').slice(0,5))}–${e(String(x.end_time||'').slice(0,5))}</td><td>${e(x.arena||'')}</td></tr>`).join('')+'</tbody></table></div>':'<p>No upcoming skates posted.</p>'}).catch(()=>{document.getElementById('publicSessions').innerHTML='<p>Schedule is temporarily unavailable.</p>'})</script></body></html>
