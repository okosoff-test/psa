<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skating School</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar"><div class="brand">Skating School</div><a class="btn" href="/admin.html">Admin</a></div><main class="shell"><div class="card"><h1>Upcoming Skates</h1><p class="muted">Public calendar</p><div id="publicSessions"></div></div></main><script>fetch('/api/calendar').then(r=>r.json()).then(rows=>{document.getElementById('publicSessions').innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Program</th><th>Time</th><th>Arena</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${String(x.session_date).slice(0,10)}</td><td>${x.program_name}</td><td>${String(x.start_time||'').slice(0,5)}–${String(x.end_time||'').slice(0,5)}</td><td>${x.arena||''}</td></tr>`).join('')+'</tbody></table></div>':'<p>No upcoming skates posted.</p>'})</script></body></html>
